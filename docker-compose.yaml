version: '1.0.0'
services:
  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USERNAME=postgres

  redis:
    image: redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx
    ports:
      - "5001:80"

  express_apis:
    build: ./express_apis
    container_name: express_apis_container
    ports:
      - "4000:4000"
    environment:
      - PORT=4000


  fastapi_apis:
    build: ./python_apis
    container_name: python_apis_container
    ports:
      - "8080:8080"
